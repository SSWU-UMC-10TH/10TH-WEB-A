<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #wrap{
            width: 1200px;
            display: grid;
            grid-template-columns: 1fr;
            margin: 0 auto;
        }
        header{
            display: flex;
        }
        .header{
            width: 300px;
            height: 100px;
            background-color: #0F1629;
        }
        .menu{
            width: 900px;
            height: 100px;
            background-color: #EF3D4D;
        }
        main{

        }
        .hero{
            width: 1200px;
            height: 600px;
            background-color: #4C86C6;
        }
        section{
           display: grid;
           grid-template-columns: 600px 300px 300px;
        }
        .main{
            width: 600px;
            height: 600px;
            background-color: #24344B;
        }

        .space{
            width: 300px;
            height: 600px;
        }

        article{
            display: flex;
            flex-direction: column;
        }

        article>div{
            width: 300px;
            height: 300px;
        }

        .image{
            background-color: #C1E4E6;
        }

        .extra{
            background-color: #4DBD97;
        }

        .banner{
            width: 1200px;
            height: 100px;
            background-color: #FFD168;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <header>
            <div class="header"></div>
            <div class="menu"></div>
        </header>
        <main>
            <div class="hero"></div>
            <section>
                <div class="main"></div>
                <div class="space"></div>
                <article>
                    <div class="image"></div>
                    <div class="extra"></div>
                </article>
            </section>
        </main>
        <footer>
            <div class="banner"></div>
        </footer>
    </div>
</body>
</html>
